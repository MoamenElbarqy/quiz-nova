global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'quiznova-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']

  - job_name: 'quiznova-db'
    static_configs:
      - targets: ['db-exporter:9187']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
