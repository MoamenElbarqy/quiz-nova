name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test

  frontend:
    name: Frontend Build & Unit Testing & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/QuizNova.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/QuizNova.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Copy .env file
        run: cp ../../.env.example ../../.env

      - name: Start Docker services
        run: docker compose -f ../../compose.yaml up -d db api
        working-directory: src/QuizNova.Client

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/health && break
            sleep 2
          done

      - name: Start Angular dev server
        run: |
          npm run start &
          npx wait-on http://localhost:4200

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: src/QuizNova.Client/playwright-report/
          retention-days: 7

      - name: Stop Docker services
        if: always()
        run: docker compose -f ../../compose.yaml down
        working-directory: src/QuizNova.Client
