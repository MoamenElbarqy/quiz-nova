name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/QuizNova.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_DB: QuizNova
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: CI_Test_Password_123!
    defaults:
      run:
        working-directory: src/QuizNova.Client
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        working-directory: .
        run: docker compose up -d db api client

      - name: Wait for services to be ready
        run: |
          echo "Waiting for API..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/health 2>/dev/null || curl -sf http://localhost:8080 2>/dev/null; do sleep 3; done' || true
          echo "Waiting for Client..."
          timeout 120 bash -c 'until curl -sf http://localhost:4200; do sleep 3; done'
          echo "All services are ready."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/QuizNova.Client/playwright-report/
          retention-days: 14

      - name: Stop services
        if: always()
        working-directory: .
        run: docker compose down -v
