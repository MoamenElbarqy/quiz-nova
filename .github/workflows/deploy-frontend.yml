name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/QuizNova.Client/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "src/QuizNova.Client/package-lock.json"

      - name: Install Dependencies
        working-directory: src/QuizNova.Client
        run: npm ci

      - name: Build Angular Client
        working-directory: src/QuizNova.Client
        run: npm run build -- --base-href /quiz-nova/

      - name: SPA Routing Fix (Create 404.html)
        working-directory: src/QuizNova.Client
        run: cp dist/quiz-nova-client/browser/index.html dist/quiz-nova-client/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: src/QuizNova.Client/dist/quiz-nova-client/browser
          branch: gh-pages
